<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario dell'Avvento</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;text-align:center;padding:2rem">Caricamento del calendario e delle missioni…</p>
  <script>
    (async function restoreCalendar() {
      const previousVersion = "https://raw.githubusercontent.com/danielac240/calendario-avvento/af75360378ce86eb09b1efddb427fd07fb69dc3c/index.html";
      try {
        const response = await fetch(previousVersion);
        if (!response.ok) throw new Error("Impossibile recuperare la versione completa del calendario.");
        let html = await response.text();

        html = html.replace("</style>", `
.btn-unlock{background:#fff4d8;color:#7a5310;border:1px solid #e2be6b}
.btn-unlock.active{background:#d54b55;color:#fff;border-color:#b8323c}
.unlock-status{font-size:.8rem;color:#8a6423;margin:8px 0 0}
</style>`);

        html = html.replace(
          '<button class="btn-sm btn-reset"',
          '<button id="btnUnlock" class="btn-sm btn-unlock" onclick="toggleTemporaryUnlock()" title="Sblocca temporaneamente tutte le date">🔓 Sblocca tutte le date</button>\n        <button class="btn-sm btn-reset"'
        );
        html = html.replace(
          '<p id="saveStatus"',
          '<p id="unlockStatus" class="unlock-status hidden">Le date sono temporaneamente sbloccate.</p>\n      <p id="saveStatus"'
        );
        html = html.replace(
          'function available(day) { return today >= dateFor(day); }',
          `let temporaryUnlock = false;
function available(day) { return temporaryUnlock || today >= dateFor(day); }
function toggleTemporaryUnlock() {
  temporaryUnlock = !temporaryUnlock;
  const button = document.getElementById("btnUnlock");
  button.classList.toggle("active", temporaryUnlock);
  button.textContent = temporaryUnlock ? "🔒 Blocca le date" : "🔓 Sblocca tutte le date";
  document.getElementById("unlockStatus").classList.toggle("hidden", !temporaryUnlock);
  render();
}`
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = "<p style=\"font-family:system-ui,sans-serif;text-align:center;padding:2rem;color:#9a4a27\">Non è stato possibile caricare il calendario. Riprova aggiornando la pagina.</p>";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
